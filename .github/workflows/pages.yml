# Two jobs. `build` runs on every push, pull request and manual run, and is the guard: a page the
# site cannot render or a link that resolves to nothing fails here. `deploy` runs only from `main`.
name: Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued one waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The repository's name as spelled, set once and given to the build and to the link check.
  SITE_BASE: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: site
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: node scripts/check-site-links.mjs dist
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
